<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240"><rect width="1000" height="240" fill="#f8fafc"/><style>text{font:18px Arial,'Microsoft YaHei',sans-serif;fill:#17324d}.t{font-size:22px;font-weight:bold}rect.box{stroke:#94a3b8;stroke-width:2}</style><text class="t" x="500" y="38" text-anchor="middle">Monte Carlo：允许部分上坡，以探索更多构象</text><g text-anchor="middle"><rect class="box" x="20" y="80" width="205" height="80" rx="12" fill="#dbeafe"/><text x="122" y="114">当前结构 x</text><text x="122" y="140">计算 E(x)</text><rect class="box" x="275" y="80" width="205" height="80" rx="12" fill="#dcfce7"/><text x="377" y="114">提出结构 x′</text><text x="377" y="140">片段插入或扰动</text><rect class="box" x="530" y="80" width="205" height="80" rx="12" fill="#fef3c7"/><text x="632" y="114">计算 ΔE</text><text x="632" y="140">按概率接受或拒绝</text><rect class="box" x="785" y="80" width="195" height="80" rx="12" fill="#fce7f3"/><text x="882" y="114">继续迭代</text><text x="882" y="140">记录最佳模型</text><text x="250" y="128">→</text><text x="505" y="128">→</text><text x="760" y="128">→</text></g><text x="500" y="205" text-anchor="middle">拒绝时保留 x；接受时以 x′ 为下一步的起点</text></svg>
